server:
  port: 8080
  address: 0.0.0.0

aliyun:
  oss:
    endpoint: "${ALIYUN_OSS_ENDPOINT:oss-cn-shanghai.aliyuncs.com}"
    bucket: "${ALIYUN_OSS_BUCKET:你的bucket名称}"
    access-key-id: "${ALIYUN_OSS_ACCESS_KEY_ID:}"
    access-key-secret: "${ALIYUN_OSS_ACCESS_KEY_SECRET:}"
    dir-prefix: "order-tracking"
    expire-seconds: 300
    max-size-mb: 10

spring:
  application:
    name: Quote-System

  datasource:
    druid:
      business:
        url: jdbc:mysql://127.0.0.1:3306/quote?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
        username: root
        password: 123456
        driver-class-name: com.mysql.cj.jdbc.Driver
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
      system:
        url: jdbc:mysql://127.0.0.1:3306/quote_auth?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
        username: root
        password: 123456
        driver-class-name: com.mysql.cj.jdbc.Driver
        initial-size: 3
        min-idle: 3
        max-active: 15
        max-wait: 60000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false

  data:
    redis:
      host: 192.168.234.101
      port: 6379
      database: 0
      password:
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 300MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.stonebridge.quotesystem.**.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境建议注释掉 SQL 打印。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-value: 1
      logic-not-delete-value: 0

security:
  auth-enabled: true
  jwt:
    secret: "${JWT_SECRET:QuoteSystemJwtSecretKeyQuoteSystemJwtSecretKey2026QuoteSystemJwtSecretKey}"
    issuer: "quote-system"
    header-name: "Authorization"
    token-prefix: "Bearer "
    access-token-expire-seconds: 7200
    blacklist-key-prefix: "security:jwt:blacklist:"
  authorization-cache:
    key-prefix: "security:authorization:user:"
    ttl-seconds: 600
